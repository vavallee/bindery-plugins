pluginVersion: "0.5.0"
# pluginName must match the `name` attribute of the plugin class in
# plugins/calibre-bridge/__init__.py. Calibre keys its plugin registry by that
# name, so a mismatch here shows up as "plugin installed but never loaded".
pluginName: "Bindery Bridge"
calibreDeploymentName: calibre
calibreNamespace: default
# Mount path of the Calibre config volume inside the container. This is the
# Calibre container's HOME.
calibreHome: /config
# Calibre's config directory inside the container. It must live under
# calibreHome so the registry lands on the persistent volume. The plugin registry lives in
# <calibreConfigDir>/customize.py.json and the registered zip is copied to
# <calibreConfigDir>/plugins by calibre itself. Do not point this at the plugins
# subdirectory: calibre never scans that directory, it reads the registry.
calibreConfigDir: /config/.config/calibre
volumeName: config
# selectorLabels must match the existing calibre Deployment's pod selector labels.
# This is used to populate spec.selector in the strategic-merge patch so helm lint
# can validate the template; the selector itself is immutable in Kubernetes and will
# not change if it already matches the running Deployment.
selectorLabels:
  app.kubernetes.io/name: calibre

# runAsUser for both init containers. It has to own /config, so it must match
# the PUID the Calibre container runs as.
runAsUser: 1000

# Image used to download and checksum the release zip. Pinned by digest; the tag
# is kept alongside it for readability only.
image:
  repository: curlimages/curl
  tag: 8.22.0
  digest: "sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"

# Image used to register the plugin with calibre. It must provide the
# calibre-customize CLI, so in practice it is the same image the Calibre
# Deployment itself runs. Set digest to pin it.
calibreImage:
  repository: lscr.io/linuxserver/calibre
  tag: latest
  digest: ""
  customizePath: calibre-customize

releaseUrlTemplate: "https://github.com/vavallee/bindery-plugins/releases/download/v-calibre-bridge-{{ .Values.pluginVersion }}/calibre-bridge-v{{ .Values.pluginVersion }}.zip"
# The release publishes <zip>.sha256 next to the zip. Verification is on by
# default; turning it off downloads an unverified artefact into a persistent
# volume, so only do that against a mirror you control.
verifyChecksum: true

# networkPolicy: opt-in traffic restriction for the calibre pod.
#
# egress covers the init container's download. ingress covers the bridge's own
# listener, which the plugin binds on 0.0.0.0:8099 by default, so without an
# ingress rule anything in the cluster can reach it.
#
# Read this before enabling ingress: a NetworkPolicy with Ingress in policyTypes
# denies every port that is not explicitly allowed. openPorts is what keeps the
# Calibre web GUI reachable. Add anything else you expose.
networkPolicy:
  enabled: false
  egress:
    enabled: true
    # Leave empty to allow HTTPS to any destination.
    cidrs: []
    # cidrs:
    #   - 140.82.112.0/20   # github.com
    #   - 185.199.108.0/22  # github releases CDN
    #   - 199.232.0.0/16    # fastly CDN
  ingress:
    enabled: true
    bridgePort: 8099
    # Peers allowed to reach the bridge port. Required when ingress is enabled:
    # rendering fails if this is empty, because an ingress rule with no peers
    # would admit the whole cluster. Entries are NetworkPolicyPeer objects and
    # are passed through as written, so operators running Bindery in another
    # namespace just point the namespaceSelector at it.
    from: []
    # from:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: bindery
    #     podSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: bindery
    # Ports that stay reachable from anywhere. Defaults are the linuxserver
    # Calibre web GUI and content server.
    openPorts:
      - 8080
      - 8081
