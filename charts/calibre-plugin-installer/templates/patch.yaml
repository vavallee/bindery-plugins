{{- include "calibre-plugin-installer.checkRemovedValues" . -}}
{{- $zip := include "calibre-plugin-installer.zipName" . -}}
{{- $pinned := include "calibre-plugin-installer.pluginSha256" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.calibreDeploymentName | quote }}
  namespace: {{ .Values.calibreNamespace | quote }}
  annotations:
    bindery.plugins/installed-version: {{ .Values.pluginVersion | quote }}
spec:
  selector:
    matchLabels:
      {{- .Values.selectorLabels | toYaml | nindent 6 }}
  template:
    spec:
      initContainers:
        # Step 1: fetch the release zip and its published checksum into a
        # scratch volume. This container needs the network; step 2 does not.
        - name: bindery-bridge-fetch
          image: {{ include "calibre-plugin-installer.image" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PLUGIN_VERSION
              value: {{ .Values.pluginVersion | quote }}
            - name: PLUGIN_URL
              value: {{ tpl .Values.releaseUrlTemplate . | quote }}
            - name: PLUGIN_ZIP
              value: {{ $zip | quote }}
            - name: VERIFY_CHECKSUM
              value: {{ .Values.verifyChecksum | quote }}
            # Expected SHA-256 of the zip, from values. Empty means not pinned.
            - name: PLUGIN_SHA256
              value: {{ $pinned | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              cd /bindery-stage
              echo "Downloading Bindery Bridge ${PLUGIN_VERSION} from ${PLUGIN_URL}"
              curl --proto '=https' --proto-redir '=https' \
                --retry 5 --retry-delay 4 --retry-connrefused --connect-timeout 10 \
                --max-time 120 --fail -sSL "$PLUGIN_URL" -o "$PLUGIN_ZIP"
              # A hash from values does not come from the download origin, so a
              # swapped release asset cannot also swap this. Fails closed.
              if [ -n "$PLUGIN_SHA256" ]; then
                actual=$(sha256sum "$PLUGIN_ZIP" | cut -d ' ' -f 1)
                if [ "$actual" != "$PLUGIN_SHA256" ]; then
                  echo "ERROR: ${PLUGIN_ZIP} does not match pluginSha256"
                  echo "expected ${PLUGIN_SHA256}"
                  echo "got      ${actual}"
                  exit 1
                fi
                echo "pluginSha256 matched for ${PLUGIN_ZIP}"
              fi
              if [ "$VERIFY_CHECKSUM" = "true" ]; then
                curl --proto '=https' --proto-redir '=https' \
                  --retry 5 --retry-delay 4 --retry-connrefused --connect-timeout 10 \
                  --max-time 60 --fail -sSL "${PLUGIN_URL}.sha256" -o "${PLUGIN_ZIP}.sha256"
                # The sidecar must be one line naming exactly this zip.
                # sha256sum -c alone would check whatever file it names.
                if [ "$(grep -c '' "${PLUGIN_ZIP}.sha256")" != "1" ]; then
                  echo "ERROR: ${PLUGIN_ZIP}.sha256 is not a single line"
                  exit 1
                fi
                read -r sidecar_sum sidecar_name < "${PLUGIN_ZIP}.sha256" || true
                sidecar_name=${sidecar_name#\*}
                if [ "$sidecar_name" != "$PLUGIN_ZIP" ]; then
                  echo "ERROR: ${PLUGIN_ZIP}.sha256 names a different file than ${PLUGIN_ZIP}"
                  exit 1
                fi
                printf '%s  %s\n' "$sidecar_sum" "$PLUGIN_ZIP" | sha256sum -c -
                echo "Checksum verified for ${PLUGIN_ZIP}"
              elif [ -z "$PLUGIN_SHA256" ]; then
                echo "WARNING: checksum verification disabled, ${PLUGIN_ZIP} is unverified"
              fi
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: bindery-bridge-stage
              mountPath: /bindery-stage
        # Step 2: register the zip with calibre. Calibre loads plugins from the
        # `plugins` entry in <config dir>/customize.py.json, which
        # calibre.customize.ui.initialize_plugins reads at startup; it never
        # scans the plugins directory. calibre-customize -a is the supported way
        # to write that entry, and it copies the zip into place itself.
        - name: bindery-bridge-register
          image: {{ include "calibre-plugin-installer.image" .Values.calibreImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: {{ .Values.calibreHome | quote }}
            - name: CALIBRE_CONFIG_DIRECTORY
              value: {{ .Values.calibreConfigDir | quote }}
            - name: CALIBRE_CUSTOMIZE
              value: {{ .Values.calibreImage.customizePath | quote }}
            - name: PLUGIN_NAME
              value: {{ .Values.pluginName | quote }}
            - name: PLUGIN_ZIP
              value: {{ $zip | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p "$CALIBRE_CONFIG_DIRECTORY"
              "$CALIBRE_CUSTOMIZE" -a "/bindery-stage/$PLUGIN_ZIP"
              if ! "$CALIBRE_CUSTOMIZE" -l | grep -qF "$PLUGIN_NAME"; then
                echo "ERROR: ${PLUGIN_NAME} is not in calibre's plugin registry after install"
                exit 1
              fi
              echo "Registered ${PLUGIN_NAME} in ${CALIBRE_CONFIG_DIRECTORY}/customize.py.json"
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bindery-bridge-stage
              mountPath: /bindery-stage
              readOnly: true
            - name: bindery-bridge-tmp
              mountPath: /tmp
            - name: {{ .Values.volumeName | quote }}
              mountPath: {{ .Values.calibreHome | quote }}
      volumes:
        - name: bindery-bridge-stage
          emptyDir: {}
        - name: bindery-bridge-tmp
          emptyDir: {}
