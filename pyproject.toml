[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"plugins/calibre-bridge/tests/*" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["plugins/calibre-bridge/tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# Run as: mypy --explicit-package-bases plugins/calibre-bridge/plugin/*.py
# (calibre-bridge directory name has a hyphen; explicit-package-bases avoids the
#  invalid-package-name error when mypy traverses parent directories)

[[tool.mypy.overrides]]
# Calibre + Qt modules ship no type stubs
module = ["calibre.*", "calibre_plugins.*", "qt.*", "PyQt5.*"]
ignore_missing_imports = true
ignore_errors = true
