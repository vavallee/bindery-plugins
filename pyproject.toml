[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"plugins/calibre-bridge/tests/*" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["plugins/calibre-bridge/tests", "tests"]
addopts = "-ra"

[tool.coverage.report]
# The floor for `pytest --cov`, which is how the CI test job runs the plugin
# suite. pytest-cov reads it from here and fails the run below it.
fail_under = 90

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# Run as: (cd plugins/calibre-bridge && mypy --ignore-missing-imports --explicit-package-bases plugin)
# (the calibre-bridge directory name has a hyphen, so mypy rejects it as a
#  package name when given the path from the repository root)

[[tool.mypy.overrides]]
# Calibre + Qt modules ship no type stubs
module = ["calibre.*", "calibre_plugins.*", "qt.*", "PyQt5.*"]
ignore_missing_imports = true
ignore_errors = true
