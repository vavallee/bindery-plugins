name: Calibre check

# One Calibre version, checked end to end. Called by calibre-integration.yml,
# which decides which versions run and when. Kept as a reusable workflow so
# the pinned legs and the scheduled "latest" job share every step. The caller's
# `contents: read` is all this workflow gets.

on:
  workflow_call:
    inputs:
      calibre:
        description: A Calibre version such as 9.18.0, or "latest".
        required: true
        type: string
      plugin_ref:
        description: >-
          Tag or commit whose plugins/calibre-bridge is built and tested.
          Empty tests the checked out ref's own plugin.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CALIBRE_VERSION: ${{ inputs.calibre }}
      PLUGIN_REF: ${{ inputs.plugin_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the plugin under test
        if: env.PLUGIN_REF != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PLUGIN_REF }}
          path: plugin-under-test
          persist-credentials: false

      - name: Install the system libraries Calibre's Qt needs
        # The three the Calibre installer checks for and refuses to run
        # without. Everything else Calibre uses ships inside its own bundle.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxcb-cursor0

      - name: Restore Calibre from the cache
        id: calibre-cache
        if: inputs.calibre != 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/calibre-bin
          key: calibre-${{ runner.os }}-${{ runner.arch }}-${{ inputs.calibre }}

      - name: Install Calibre
        if: steps.calibre-cache.outputs.cache-hit != 'true'
        # Calibre's official binary installer. It checks the tarball against
        # a SHA-512 it fetches separately from code.calibre-ebook.com, so the
        # trust root is TLS to Calibre's own hosts, not a signing key.
        # isolated=y unpacks into install_dir and touches nothing else.
        run: |
          wget -nv -O "$RUNNER_TEMP/linux-installer.sh" https://download.calibre-ebook.com/linux-installer.sh
          args=(install_dir="$HOME/calibre-bin" isolated=y)
          if [ "$CALIBRE_VERSION" != "latest" ]; then
            args+=(version="$CALIBRE_VERSION")
          fi
          sh "$RUNNER_TEMP/linux-installer.sh" "${args[@]}"

      - name: Show the Calibre version
        run: |
          "$HOME/calibre-bin/calibre/calibre-debug" --version

      - name: Choose the plugin source
        run: |
          if [ -n "$PLUGIN_REF" ]; then
            echo "PLUGIN_DIR=plugin-under-test/plugins/calibre-bridge" >> "$GITHUB_ENV"
          else
            echo "PLUGIN_DIR=plugins/calibre-bridge" >> "$GITHUB_ENV"
          fi

      - name: Model check (real library, real BooksModel)
        id: model
        run: |
          python3 plugins/calibre-bridge/tests/integration/run.py model \
            --calibre-dir "$HOME/calibre-bin/calibre" --plugin-dir "$PLUGIN_DIR"

      - name: Boot check (full Calibre, HTTP round trip)
        # The two checks are independent, so a failed model check does not
        # hide what the boot check has to say.
        if: success() || steps.model.conclusion == 'failure'
        run: |
          python3 plugins/calibre-bridge/tests/integration/run.py boot \
            --calibre-dir "$HOME/calibre-bin/calibre" --plugin-dir "$PLUGIN_DIR"
