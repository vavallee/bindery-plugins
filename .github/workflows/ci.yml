name: CI

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test-calibre-bridge:
    name: test calibre-bridge
    uses: ./.github/workflows/plugin-test.yml
    with:
      plugin_dir: plugins/calibre-bridge

  test-release-tooling:
    name: test release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # scripts/ runs on the CI runner, not inside Calibre, so it is tested on
      # the runner interpreter rather than the Calibre matrix.
      - name: Run tests
        run: pytest tests

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check plugins/ scripts/ tests/
      - name: ruff format --check
        run: ruff format --check plugins/ scripts/ tests/
      - name: mypy
        run: |
          (cd plugins/calibre-bridge && mypy --ignore-missing-imports --explicit-package-bases plugin)
          mypy --ignore-missing-imports scripts/

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test-calibre-bridge, test-release-tooling, lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build plugin zip
        run: python scripts/build_plugin.py plugins/calibre-bridge --output-dir dist
      - name: Verify the published checksum sidecar
        # The Helm installer runs `sha256sum -c` against this file. If the
        # sidecar and the zip ever disagree, every Tier 2 install fails closed.
        run: (cd dist && sha256sum -c ./*.zip.sha256)
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibre-bridge
          path: dist/
          retention-days: 30

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build plugin zip
        run: python scripts/build_plugin.py plugins/calibre-bridge --output-dir dist
      - name: Verify the published checksum sidecar
        run: (cd dist && sha256sum -c ./*.zip.sha256)
      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#-calibre-bridge-}"
          VERSION="${VERSION#calibre-bridge-}"
          python <<'PY' > release_notes.md
          import os, re, pathlib
          version = os.environ['VERSION']
          text = pathlib.Path('CHANGELOG.md').read_text()
          pattern = re.compile(r'^### \[' + re.escape(version) + r'\].*?(?=^### \[|\Z)', re.M | re.S)
          m = pattern.search(text)
          print(m.group(0).strip() if m else f'Release {version}')
          PY
        env:
          VERSION: ${{ github.ref_name }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/*.zip dist/*.sha256
