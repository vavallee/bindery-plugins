name: CI

on:
  push:
    branches: [main]
    # A calibre-bridge release tag and nothing else. The release job checks
    # the tag again, strictly, in scripts/release_guard.py.
    tags: ["v-calibre-bridge-[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-calibre-bridge:
    name: test calibre-bridge
    uses: ./.github/workflows/plugin-test.yml
    with:
      plugin_dir: plugins/calibre-bridge

  test-release-tooling:
    name: test release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # tests/test_chart_installer.py renders the chart, and fails without helm
      # on CI rather than skipping. Same pin as the IaC job in security.yml.
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.4
      - name: Show the Helm version
        run: helm version --short
      # scripts/ runs on the CI runner, not inside Calibre, so it is tested on
      # the runner interpreter rather than the Calibre matrix.
      - name: Run tests
        run: pytest tests
      # The plugin version against the changelog, and the chart and ArgoCD
      # pins against each other, so a release PR or a chart PR that leaves
      # one behind fails here and not at tag time.
      - name: Check version consistency
        run: python scripts/check_versions.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check plugins/ scripts/ tests/
      - name: ruff format --check
        run: ruff format --check plugins/ scripts/ tests/
      - name: mypy
        run: |
          (cd plugins/calibre-bridge && mypy --ignore-missing-imports --explicit-package-bases plugin)
          mypy --ignore-missing-imports scripts/
      # The tarball is checked against a digest written here, so a changed
      # release asset fails the job instead of running. To bump, take the new
      # digest from the release's checksums file and update both lines.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
      # Every `uses:` that names a remote action must be a full commit SHA.
      # Local reusable workflows (./.github/...) are exempt.
      - name: Actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rnE '^\s*(-\s+)?uses:' .github \
            | grep -vE 'uses:\s+\./' \
            | grep -vE 'uses:\s+[^ ]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "${unpinned}" ]; then
            echo "These uses: lines are not pinned to a 40 character commit SHA:"
            echo "${unpinned}"
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test-calibre-bridge, test-release-tooling, lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build plugin zip
        run: python scripts/build_plugin.py plugins/calibre-bridge --output-dir dist
      - name: Verify the published checksum sidecar
        # The Helm installer runs `sha256sum -c` against this file. If the
        # sidecar and the zip ever disagree, every Tier 2 install fails closed.
        run: (cd dist && sha256sum -c ./*.zip.sha256)
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibre-bridge
          path: dist/
          retention-days: 30

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v-calibre-bridge-')
    permissions:
      contents: write
      # For the build provenance step only: a Sigstore signing certificate
      # through OIDC, and the upload to the attestations API.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, branches included, so the guard can tell whether
          # the tagged commit is on main.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Nothing is built or published unless the tag is v-calibre-bridge-X.Y.Z,
      # X.Y.Z is the version in the plugin's __init__.py, the tagged commit is
      # on main, and CHANGELOG.md has notes for it. Those notes become the
      # release body. Tested in tests/test_release_guard.py.
      - name: Release guard
        run: |
          python scripts/release_guard.py \
            --tag "${GITHUB_REF_NAME}" \
            --plugin-dir plugins/calibre-bridge \
            --notes-out release_notes.md
      - name: Build plugin zip
        run: python scripts/build_plugin.py plugins/calibre-bridge --output-dir dist
      - name: Verify the published checksum sidecar
        run: (cd dist && sha256sum -c ./*.zip.sha256)
      # SLSA build provenance for the zip, signed through Sigstore and stored
      # by GitHub. Verify a download with
      # `gh attestation verify calibre-bridge-vX.Y.Z.zip --repo vavallee/bindery-plugins`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/*.zip dist/*.sha256
