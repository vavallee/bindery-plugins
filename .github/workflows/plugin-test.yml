name: Plugin test (reusable)

on:
  workflow_call:
    inputs:
      plugin_dir:
        description: "Path to the plugin directory, e.g. plugins/calibre-bridge"
        required: true
        type: string
      python_versions:
        description: "JSON array of Python versions to test against"
        required: false
        type: string
        # These are the interpreters Calibre actually embeds, read from
        # bypy/sources.json in the Calibre tree: 3.10 for Calibre 6.x, 3.11 for
        # Calibre 7.x and 8.x, 3.14 for Calibre 9.x. The plugin declares
        # minimum_calibre_version=(6,0,0), so that is the whole supported range.
        # No Calibre release embeds 3.12 or 3.13.
        default: '["3.10", "3.11", "3.14"]'
      upload_coverage:
        description: "Upload coverage artifact (uses upload_coverage_version)"
        required: false
        type: boolean
        default: true
      upload_coverage_version:
        description: "Python version to upload coverage from"
        required: false
        type: string
        default: "3.14"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ inputs.plugin_dir }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # The input reaches the shell through the environment, never by
      # interpolating the expression into the script text.
      - name: Run tests
        env:
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
        run: |
          pytest "${PLUGIN_DIR}/tests" \
            --cov="${PLUGIN_DIR}/plugin" \
            --cov-report=xml \
            --cov-report=term
      - name: Bandit security scan
        env:
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
        run: bandit -r "${PLUGIN_DIR}/plugin" -x "${PLUGIN_DIR}/tests"
      - name: Compute coverage artifact name
        id: cov
        if: inputs.upload_coverage && matrix.python-version == inputs.upload_coverage_version
        env:
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
        # upload-artifact@v4 rejects '/' in names; plugin_dir is a path, so slug it.
        run: echo "name=coverage-${PLUGIN_DIR//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage
        if: inputs.upload_coverage && matrix.python-version == inputs.upload_coverage_version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.cov.outputs.name }}
          path: coverage.xml
          retention-days: 7
