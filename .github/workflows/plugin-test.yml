name: Plugin test (reusable)

on:
  workflow_call:
    inputs:
      plugin_dir:
        description: "Path to the plugin directory, e.g. plugins/calibre-bridge"
        required: true
        type: string
      python_versions:
        description: "JSON array of Python versions to test against"
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'
      upload_coverage:
        description: "Upload coverage artifact (uses upload_coverage_version)"
        required: false
        type: boolean
        default: true
      upload_coverage_version:
        description: "Python version to upload coverage from"
        required: false
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ inputs.plugin_dir }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov bandit
      - name: Run tests
        run: |
          pytest ${{ inputs.plugin_dir }}/tests \
            --cov=${{ inputs.plugin_dir }}/plugin \
            --cov-report=xml \
            --cov-report=term
      - name: Bandit security scan
        run: bandit -r ${{ inputs.plugin_dir }}/plugin -x ${{ inputs.plugin_dir }}/tests
      - name: Compute coverage artifact name
        id: cov
        if: inputs.upload_coverage && matrix.python-version == inputs.upload_coverage_version
        env:
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
        # upload-artifact@v4 rejects '/' in names; plugin_dir is a path, so slug it.
        run: echo "name=coverage-${PLUGIN_DIR//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage
        if: inputs.upload_coverage && matrix.python-version == inputs.upload_coverage_version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.cov.outputs.name }}
          path: coverage.xml
          retention-days: 7
