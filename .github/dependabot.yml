version: 2
updates:
  - package-ecosystem: pip
    # This matched nothing until requirements-dev.txt existed: pyproject.toml
    # declares no dependencies and the plugin has none at runtime, so there was
    # no manifest here for dependabot to read.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
