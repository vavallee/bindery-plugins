version: 2
updates:
  - package-ecosystem: pip
    # The manifest lives in .github, not the repo root. Pointing this at "/"
    # matched nothing, because there is no root requirements file and
    # pyproject.toml declares no dependencies.
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
