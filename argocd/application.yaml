apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: calibre-plugin-installer
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: homelab
            namespace: default
            # The release to install. It moves together with targetRevision
            # below, in the chart PR that follows each release:
            # python scripts/bump_chart.py X.Y.Z
            pluginVersion: "0.8.4"
            # Required. The SHA-256 of calibre-bridge-v<pluginVersion>.zip, taken
            # from the release's .sha256 file and checked against the release
            # notes from your own machine. The chart refuses to render without it.
            # Change it together with pluginVersion.
            pluginSha256: "27e363a6e09c28315d2911e45805b02ff2959c8976ed177885fc235b121150ac"
  template:
    metadata:
      name: "calibre-plugin-installer-{{cluster}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/vavallee/bindery-plugins
        # The chart as of that release tag. Moves with pluginVersion above.
        # A tag can be moved by whoever can push to the repo, and the chart
        # decides what runs next to your library, so for production pin the
        # commit SHA the tag points at instead, with the tag in a comment:
        #   targetRevision: <40 hex digit commit SHA>  # v-calibre-bridge-0.8.4
        targetRevision: 4af2e452826fa846386be27e84229660a2ff1079  # v-calibre-bridge-0.8.4
        path: charts/calibre-plugin-installer
        helm:
          releaseName: calibre-plugin-installer
          valuesObject:
            pluginVersion: "{{pluginVersion}}"
            pluginSha256: "{{pluginSha256}}"
            calibreDeploymentName: calibre
            calibreNamespace: "{{namespace}}"
            calibreHome: /config
            calibreConfigDir: /config/.config/calibre
            volumeName: config
            calibreImage:
              # Must match the image the Calibre Deployment runs; it supplies
              # the calibre-customize CLI that registers the plugin.
              repository: lscr.io/linuxserver/calibre
              tag: latest
              # Pinned by digest in the chart's values.yaml. Override it here
              # with the digest of the image your Calibre Deployment runs.
              # digest: "sha256:..."
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
